name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  GO_VERSION: 1.27.4
  GOIMPORTS_VERSION: v0.49.0
  GOLANGCI_LINT_VERSION: v2.15.0
  # ubuntu-latest (26.04) ships fcitx5 5.1.19, which predates
  # InputPanel::overlayMessage (5.1.22) used by the integration test.
  # Build a newer fcitx5 from source as an embedded library instead.
  FCITX5_VERSION: 5.1.23

jobs:
  daemon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: daemon/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@${{ env.GOIMPORTS_VERSION }}

      - name: Install golangci-lint
        run: |
          curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b "$(go env GOPATH)/bin" "${{ env.GOLANGCI_LINT_VERSION }}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Format check
        run: test -z "$("$(go env GOPATH)/bin/goimports" -local github.com/elmhuangyu/fcitx5-gemini-asr/daemon -l .)"

      - name: Lint check
        run: golangci-lint run ./...

      - name: Build
        run: go build -v ./...

      - name: Run tests
        run: go test -v -race ./...

  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            pkg-config \
            clang-format \
            gettext \
            extra-cmake-modules \
            libuv1-dev \
            uuid-dev \
            git \
            make

      - name: Build and install fcitx5 core
        run: |
          git clone --depth 1 --branch "$FCITX5_VERSION" https://github.com/fcitx/fcitx5.git /tmp/fcitx5
          cmake -S /tmp/fcitx5 -B /tmp/fcitx5/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DENABLE_KEYBOARD=Off \
            -DENABLE_X11=Off \
            -DENABLE_WAYLAND=Off \
            -DENABLE_ENCHANT=Off \
            -DENABLE_DBUS=Off \
            -DENABLE_SERVER=Off \
            -DENABLE_EMOJI=Off \
            -DUSE_SYSTEMD=Off \
            -DBUILD_SPELL_DICT=Off \
            -DENABLE_TEST=Off \
            -DENABLE_TESTING_ADDONS=Off
          cmake --build /tmp/fcitx5/build -j"$(nproc)"
          sudo cmake --install /tmp/fcitx5/build
          sudo ldconfig
          pkg-config --modversion Fcitx5Core

      - name: Shell syntax check
        run: bash -n install.sh

      - name: Format check
        run: clang-format --dry-run --Werror addon/*.h addon/*.cpp addon/tests/*.cpp

      - name: Build
        run: |
          cmake -S addon -B addon/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TEST=ON \
            -DCMAKE_CXX_FLAGS="-Werror"
          cmake --build addon/build -j"$(nproc)"

      - name: Verify translations
        run: test -f addon/build/po/fcitx5-gemini-voice-zh_CN.mo

      - name: Run tests
        run: ctest --test-dir addon/build --output-on-failure

      - name: Verify exported factory symbol
        run: nm -D addon/build/libgemini-voice.so | grep -q fcitx_addon_factory_instance
