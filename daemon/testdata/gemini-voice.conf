# Show LLM Action Menu
# ShowActionMenu=True
# Daemon Unix Socket Path
# SocketPath=$XDG_RUNTIME_DIR/gemini-ime.sock
# Transcription Language
Language=cmn-Hans-CN,en-US
# Recording Prefix
# RecordingPrefix=🎙️
# Preedit Line Wrap Width
# PreeditMaxWidth=80

[TriggerKey]
0=Alt+space
1=Control+F12

[TranslateLanguages]
0=en
1="Pig Latin"

[LiveTranscription]
# Live Model
# Model=gemini-3.5-transcribe-live
# Transcription Mode
Mode=SMART
# Auto-stop Silence (ms, 0 disables)
VadSilenceMs=1500

[LiveTranscription/CustomVocabulary]
0=Fcitx5
1="Pipe Wire"

[PostProcess]
# Default Model
Model=gemini-3.5-flash/low

[PostProcess/RefineFixTypos]
# Model (empty uses default model)
# Model=
# Prompt (empty uses built-in)
# Prompt=
# Run when recording stops (prefetch)
Prefetch=False

# [PostProcess/RefineCasual]
# Model (empty uses default model)
# Model=
# Prompt (empty uses built-in)
# Prompt=
# Run when recording stops (prefetch)
# Prefetch=False

[PostProcess/RefineFormal]
# Model (empty uses default model)
Model=gemini-4-hydrogen/high
# Prompt (empty uses built-in)
Prompt="Line one \"quoted\" # not a comment\n  line two with \\ backslash: 中文"
# Run when recording stops (prefetch)
# Prefetch=True

# [PostProcess/AsPrompt]
# Model (empty uses default model)
# Model=
# Prompt (empty uses built-in)
# Prompt=
# Run when recording stops (prefetch)
# Prefetch=False

[PostProcess/Translate]
# Model (empty uses default model)
Model=gemini-3.5-flash
# Prompt (empty uses built-in)
# Prompt=
# Run when recording stops (prefetch)
Prefetch=True

# [PostProcess/AskAi]
# Model (empty uses default model)
# Model=
# Prompt (empty uses built-in)
# Prompt=
# Run when recording stops (prefetch)
# Prefetch=False

[PostProcess/Actions/0]
# Action
Name=translate_ja
# Prompt (empty uses built-in)
# Prompt=
# Model (empty uses default post-process model)
Model=gemini-3.5-flash/low

[PostProcess/Actions/1]
# Action
Name=translate_pig_latin
# Prompt (empty uses built-in)
Prompt="Translate to Pig Latin."
# Model (empty uses default post-process model)
# Model=

[Connection]
# Proxy URL
Proxy=socks5://127.0.0.1:1080
# Live WebSocket URL
LiveWsUrl=wss://example.invalid/live
# API Base URL
ApiBaseUrl=https://example.invalid/v1beta

