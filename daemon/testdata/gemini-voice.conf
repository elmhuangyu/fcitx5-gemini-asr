# Show LLM Action Menu
# ShowActionMenu=True
# Daemon Unix Socket Path
# SocketPath=$XDG_RUNTIME_DIR/gemini-ime.sock
# Transcription Language
Language=cmn-Hans-CN,en-US
# Recording Prefix
# RecordingPrefix=🎙️
# Preedit Line Wrap Width
# PreeditMaxWidth=80

[TriggerKey]
0=Alt+space
1=Control+F12

[TranslateLanguages]
0=en
1="Pig Latin"

[LiveTranscription]
# Live Model
# Model=gemini-3.5-transcribe-live
# Transcription Mode
Mode=SMART
# Auto-stop Silence (ms, 0 disables)
VadSilenceMs=1500

[LiveTranscription/CustomVocabulary]
0=Fcitx5
1="Pipe Wire"

[PostProcess]
# Default Model
Model=gemini-3.5-flash/low

# [PostProcess/Prefetch]
# 0=refine_fix_typos
# 1=refine_formal

[PostProcess/Actions/0]
# Action Name
Name=refine_casual
# Prompt (empty uses built-in)
Prompt="Line one \"quoted\" # not a comment\n  line two with \\ backslash: 中文"
# Model (empty uses default post-process model)
Model=gemini-4-hydrogen/high

[PostProcess/Actions/1]
# Action Name
Name=translate_ja
# Prompt (empty uses built-in)
# Prompt=
# Model (empty uses default post-process model)
Model=gemini-3.5-flash

[Connection]
# Proxy URL
Proxy=socks5://127.0.0.1:1080
# Live WebSocket URL
LiveWsUrl=wss://example.invalid/live
# API Base URL
ApiBaseUrl=https://example.invalid/v1beta

