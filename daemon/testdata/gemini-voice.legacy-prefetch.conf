# Show LLM Action Menu
# ShowActionMenu=True
# Daemon Unix Socket Path
# SocketPath=$XDG_RUNTIME_DIR/gemini-ime.sock
# Transcription Language
# Language=
# Recording Prefix
# RecordingPrefix=🎙️
# Preedit Line Wrap Width
PreeditMaxWidth=120

# [TriggerKey]
# 0=Alt+space

[TranslateLanguages]
0=en
1=japanese

[LiveTranscription]
# Live Model
# Model=gemini-3.5-transcribe-live
# Transcription Mode
Mode=SMART
# Custom Vocabulary
# CustomVocabulary=
# Auto-stop Silence (ms, 0 disables)
VadSilenceMs=2000

[PostProcess]
# Default Model
# Model=gemini-3.5-flash-lite
# Action Overrides
# Actions=

[PostProcess/Prefetch]
0=refine_fix_typos
1=refine_casual
2=refine_formal

# [Connection]
# Proxy URL
# Proxy=
# Live WebSocket URL
# LiveWsUrl=
# API Base URL
# ApiBaseUrl=

