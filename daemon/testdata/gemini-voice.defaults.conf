# Show LLM Action Menu
# ShowActionMenu=True
# Daemon Unix Socket Path
# SocketPath=$XDG_RUNTIME_DIR/gemini-ime.sock
# Transcription Language
# Language=
# Recording Prefix
# RecordingPrefix=🎙️
# Preedit Line Wrap Width
# PreeditMaxWidth=80
# Translation Target Languages
# TranslateLanguages=

# [TriggerKey]
# 0=Alt+space

# [LiveTranscription]
# Live Model
# Model=gemini-3.5-transcribe-live
# Transcription Mode
# Mode=VERBATIM
# Custom Vocabulary
# CustomVocabulary=
# Auto-stop Silence (ms, 0 disables)
# VadSilenceMs=1200

# [PostProcess]
# Default Model
# Model=gemini-3.5-flash-lite
# Per-action Overrides (advanced; take precedence over the groups above)
# Actions=

# [PostProcess/RefineFixTypos]
# Model (empty uses default model)
# Model=
# Prompt (empty uses built-in)
# Prompt=
# Run when recording stops (prefetch)
# Prefetch=True

# [PostProcess/RefineCasual]
# Model (empty uses default model)
# Model=
# Prompt (empty uses built-in)
# Prompt=
# Run when recording stops (prefetch)
# Prefetch=False

# [PostProcess/RefineFormal]
# Model (empty uses default model)
# Model=
# Prompt (empty uses built-in)
# Prompt=
# Run when recording stops (prefetch)
# Prefetch=True

# [PostProcess/AsPrompt]
# Model (empty uses default model)
# Model=
# Prompt (empty uses built-in)
# Prompt=
# Run when recording stops (prefetch)
# Prefetch=False

# [PostProcess/Translate]
# Model (empty uses default model)
# Model=
# Prompt (empty uses built-in)
# Prompt=
# Run when recording stops (prefetch)
# Prefetch=False

# [PostProcess/AskAi]
# Model (empty uses default model)
# Model=
# Prompt (empty uses built-in)
# Prompt=
# Run when recording stops (prefetch)
# Prefetch=False

# [Connection]
# Proxy URL
# Proxy=
# Live WebSocket URL
# LiveWsUrl=
# API Base URL
# ApiBaseUrl=

