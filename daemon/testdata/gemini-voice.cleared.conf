# Show LLM Action Menu
# ShowActionMenu=True
# Daemon Unix Socket Path
# SocketPath=$XDG_RUNTIME_DIR/gemini-ime.sock
# Transcription Language
# Language=
# Recording Prefix
# RecordingPrefix=🎙️
# Preedit Line Wrap Width
# PreeditMaxWidth=80
# Translation Target Languages
# TranslateLanguages=

# [TriggerKey]
# 0=Alt+space

[LiveTranscription]
# Live Model
# Model=gemini-3.5-transcribe-live
# Transcription Mode
# Mode=VERBATIM
# Custom Vocabulary
# CustomVocabulary=
# Auto-stop Silence (ms, 0 disables)
VadSilenceMs=0

[PostProcess]
# Default Model
# Model=gemini-3.5-flash-lite
# Prefetched Actions
Prefetch=
# Action Overrides
# Actions=

# [Connection]
# Proxy URL
# Proxy=
# Live WebSocket URL
# LiveWsUrl=
# API Base URL
# ApiBaseUrl=

